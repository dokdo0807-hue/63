<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가을 아침, 고유어를 찾아서</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF7EF;--ink:#1a1a1a;--yellow:#FFD84D;--green:#CDEFB0;--pink:#FFC9C9;--beige:#EFE8D8;--gray:#666;
--wrks-viz-font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --wrks-viz-primary: #2563eb; --wrks-viz-bg: #ffffff; --wrks-viz-fg: #111827; --wrks-viz-border: #d1d5db; --wrks-viz-radius: 8px; --wrks-viz-space-1: 4px; --wrks-viz-space-2: 8px; --wrks-viz-space-3: 12px; --wrks-viz-space-4: 16px;}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Noto Sans KR",-apple-system,"Segoe UI",sans-serif;color:var(--ink);background-color:var(--cream);
background-image:linear-gradient(#e9e3d3 1px,transparent 1px),linear-gradient(90deg,#e9e3d3 1px,transparent 1px);background-size:26px 26px}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 40px}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:20px;margin-bottom:16px}
.badge{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:800;font-size:13px}
.badge.w{background:#fff}
h1.t{font-family:"Black Han Sans",Pretendard,"Noto Sans KR",sans-serif;font-size:28px;margin:10px 0 6px;font-weight:900;line-height:1.3}
h2.q{font-size:18px;margin:16px 0 10px;font-weight:800}
.desc{color:var(--gray);font-size:14px;margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--ink);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;background:#fff;cursor:pointer;font-family:inherit}
.tab.done{background:var(--green)} .tab.cur{background:var(--yellow)} .tab.lock{opacity:.4;cursor:not-allowed}
.btn{border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:10px 18px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);font-family:inherit;color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.y{background:var(--yellow)} .btn.g{background:var(--green)} .btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.pill{flex:1;text-align:center;border:2px solid var(--ink);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;background:var(--beige)}
.pill.ok{background:var(--green)} .pill.warn{background:var(--pink)}
.lyr{line-height:2.3;font-size:17px}
.lyr .gap{height:12px}
.w{display:inline-block;border:2px solid transparent;border-radius:8px;padding:0 5px;cursor:pointer;font-weight:600;line-height:1.5}
.w:hover{border-color:var(--ink)}
.w.sel{background:var(--yellow);border-color:var(--ink)}
.j{color:#9a9a9a}
.opt{border:2.5px solid var(--ink);border-radius:12px;padding:14px;cursor:pointer;background:#fff;font-weight:700;font-size:15px}
.opt.sel{background:var(--green)} .opt.dim{background:var(--beige);color:#888} .opt.wrong{background:var(--pink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
.note{background:var(--green);border:2px solid var(--ink);border-radius:12px;padding:12px;margin-top:12px;font-size:14px;line-height:1.6}
.note.p{background:var(--pink)} .note.b{background:var(--beige)}
textarea,input[type=text]{width:100%;border:2.5px solid var(--ink);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;background:#fffdf7;color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{border:2px solid var(--ink);padding:8px;vertical-align:top;text-align:left;line-height:1.5}
.tb th{background:var(--beige)}
td.kind{font-weight:800;white-space:nowrap} td.kind.han{background:var(--yellow)}
.row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.chip{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:800;text-align:center;font-size:16px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips .opt{min-width:110px;text-align:center}
.hero{width:100%;border:2.5px solid var(--ink);border-radius:12px;display:block;margin-bottom:14px}
.blank{display:inline-block;width:160px;max-width:100%;border:none;border-bottom:2.5px solid var(--ink);background:#fffbe6;padding:4px 8px;font-size:16px;font-family:inherit;text-align:center;border-radius:0;margin:0 2px;color:var(--ink)}
.blank:focus{outline:none;background:var(--yellow)}
.cmp{font-size:14px;line-height:1.95;background:#fffdf7;border:2px solid var(--ink);border-radius:12px;padding:12px}
.cmp .hi{background:var(--green);padding:0 3px;border-radius:4px;font-weight:700} .cmp.han .hi{background:var(--pink)}
.cmp h4{margin:0 0 8px;font-size:15px}
.sum dt{font-weight:800;margin-top:12px;font-size:14px} .sum dd{margin:4px 0 0;line-height:1.6;font-size:15px;padding-left:4px}
.sent{font-size:17px;line-height:2.4;background:var(--beige);border:2px solid var(--ink);border-radius:12px;padding:14px}
.small{font-size:12px;color:var(--gray)}
details summary{cursor:pointer;font-weight:700;margin-top:10px}
#jpgout{max-width:100%;border:2.5px solid var(--ink);border-radius:12px;margin-top:12px;display:none}
.start{text-align:center}
.start h1.t{font-size:34px}
.start input[type=text]{max-width:360px;text-align:center;font-size:18px;margin:8px auto 14px;display:block}
</style>
</head>

const KIND = {"고":"고유어","한":"한자어","혼":"혼종어"};
const Q0 = {q:"고유어는 어떤 낱말일까요?", opts:["우리말에 본디부터 있던 낱말이나 그것에 기초하여 새로 만들어진 낱말","한자를 바탕으로 만들어진 낱말"], ans:0,
 ok:"맞아요! 고유어는 '하늘, 바람, 아침'처럼 우리말에 본디부터 있던 낱말이에요. 한자를 바탕으로 만든 '학교, 행복'은 한자어라고 해요.",
 no:"아쉬워요. 한자를 바탕으로 만든 낱말은 '한자어'예요. 고유어는 '하늘, 바람, 아침'처럼 우리말에 본디부터 있던 낱말이에요."};

let S = {name:"",step:0,q0:null,sel:[],mean:{},fav:"",scene:"",good:"",b1:"",b2:"",b3:""};
function save(){ try{ localStorage.setItem("goyu_v6", JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v=localStorage.getItem("goyu_v6"); if(v){ S=Object.assign(S, JSON.parse(v)); } }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function eun(w){ if(!w) return "은/는"; const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return "은/는"; return ((c-0xAC00)%28)?"은":"는"; }
function info(w){ return D[w] || {b:w,k:"고",d:"(사전 정보 없음)"}; }
function favWords(){ return S.sel.filter(w=>info(w).k==="고"); }

function can(step){
  if(step===1) return S.q0===Q0.ans;
  if(step===2) return S.sel.length===NEED;
  if(step===3) return S.sel.every(w=>(S.mean[w]||"").trim().length>0);
  if(step===4) return favWords().length>0;
  if(step===5) return !!S.fav && S.scene.trim().length>0;
  if(step===6) return S.good.trim().length>0;
  return true;
}
function reached(step){ for(let i=1;i<step;i++){ if(!can(i)) return false; } return true; }
function go(step){ if(step<1||step>7) return; if(step>1 && !reached(step)) return; S.step=step; save(); render(); window.scrollTo(0,0); }

function tabs(){
  let h='<div class="tabs">';
  for(let i=1;i<=7;i++){
    const cls = i===S.step?"cur":(reached(i+1)?"done":(reached(i)?"":"lock"));
    h+='<button class="tab '+cls+'" onclick="go('+i+')">'+STEPS[i].tab+'</button>';
  }
  return h+'</div>';
}
function head(i){ const s=STEPS[i]; return '<span class="badge">'+s.n+'</span><h1 class="t">'+s.t+'</h1><p class="desc">'+s.d+'</p>'; }
function bar(hint, ok, nextLabel){
  const prev = S.step>1 ? '<button class="btn" onclick="go('+(S.step-1)+')">이전</button>' : '<button class="btn" onclick="S.step=0;save();render()">처음</button>';
  const next = S.step<7 ? '<button class="btn y" '+(can(S.step)?"":"disabled")+' onclick="go('+(S.step+1)+')">'+(nextLabel||"다음")+'</button>' : '';
  return '<div class="bar">'+prev+'<div class="pill '+(ok?"ok":"")+'">'+hint+'</div>'+next+'</div>';
}

/* ---------- 화면들 ---------- */
function vStart(){
  return '<div class="card start">'+(HERO_IMG?'<img class="hero" src="'+HERO_IMG+'" alt="가을 아침 일러스트">':'<div class="hero" style="padding:70px 20px;background:#FFF3D6;color:#666;font-weight:700">[가을 아침 일러스트 자리]<br><span class="small">내려받은 파일에는 보내 주신 그림이 들어갑니다.</span></div>')+
  '<span class="badge">국어 · 고유어 학습지</span><h1 class="t">가을 아침, 고유어를 찾아서</h1>'+
  '<p class="desc">노래 「가을 아침」의 노랫말에서 고유어를 찾고, 그 뜻과 느낌을 정리해 보는 활동입니다.</p>'+
  '<input type="text" id="nm" placeholder="이름을 입력하세요" value="'+esc(S.name)+'" oninput="S.name=this.value;save()">'+
  '<button class="btn y" onclick="startGo()">시작하기</button>'+
  '<p class="small" style="margin-top:14px">총 7마당 · 입력한 내용은 이 기기에 자동 저장됩니다.</p></div>';
}
function startGo(){ if(!S.name.trim()){ alert("이름을 먼저 입력해 주세요."); return; } S.step=1; save(); render(); }

function v1(){
  let h=head(1)+'<h2 class="q">'+Q0.q+'</h2><div class="grid2">';
  Q0.opts.forEach((o,i)=>{
    let cls="opt"; if(S.q0!==null){ if(i===Q0.ans) cls+=" sel"; else if(i===S.q0) cls+=" wrong"; else cls+=" dim"; }
    h+='<div class="'+cls+'" onclick="S.q0='+i+';save();render()">'+o+'</div>';
  });
  h+='</div>';
  if(S.q0!==null) h+='<div class="note '+(S.q0===Q0.ans?"":"p")+'">'+(S.q0===Q0.ans?Q0.ok:Q0.no)+'</div>';
  return h+bar(S.q0===Q0.ans?"잘했어요! [다음]을 눌러 노랫말로 가 봅시다.":"위 물음에 먼저 답해 주세요.", S.q0===Q0.ans);
}

function v2(){
  let h=head(2)+'<h2 class="q">질문1) 아래 노래에서 고유어라고 생각하는 낱말을 '+NEED+'개 선택하세요.</h2>'+
  '<p class="small">낱말을 누르면 노란색으로 표시됩니다. 회색으로 보이는 조사(을/를/의/에 …)는 선택되지 않습니다. 같은 낱말은 함께 선택됩니다.</p><div class="lyr">';
  LYRICS.split("\n").forEach(line=>{
    if(!line.trim()){ h+='<div class="gap"></div>'; return; }
    h+='<div>';
    line.trim().split(/\s+/).forEach(tok=>{
      const p=tok.split("|"); const w=p[0], j=p[1]||"";
      h+='<span class="w'+(S.sel.includes(w)?" sel":"")+'" onclick="pick(\''+w+'\')">'+w+'</span>'+(j?'<span class="j">'+j+'</span>':'')+' ';
    });
    h+='</div>';
  });
  h+='</div>';
  if(S.sel.length) h+='<div class="note b"><b>내가 고른 낱말('+S.sel.length+'/'+NEED+')</b>: '+S.sel.map(w=>'<span class="chip" style="padding:2px 8px;font-size:14px;margin:2px">'+w+'</span>').join(" ")+'</div>';
  const full=S.sel.length===NEED;
  return h+bar(full?NEED+'개를 모두 골랐어요. [다음]을 눌러 뜻을 찾아봅시다.':'고유어라고 생각하는 낱말을 '+(NEED-S.sel.length)+'개 더 고르세요. ('+S.sel.length+'/'+NEED+')', full);
}
function pick(w){
  const i=S.sel.indexOf(w);
  if(i>=0) S.sel.splice(i,1);
  else { if(S.sel.length>=NEED){ alert(NEED+"개까지만 고를 수 있어요. 다른 낱말을 빼고 다시 골라 보세요."); return; } S.sel.push(w); }
  S.fav = favWords().includes(S.fav)?S.fav:"";
  save(); render();
}

function v3(){
  let h=head(3)+'<h2 class="q">내가 고른 낱말의 뜻을 사전에서 찾아 적어 봅시다.</h2>';
  S.sel.forEach(w=>{
    h+='<div class="row"><div class="chip">'+w+'</div><textarea placeholder="[사전에서 찾은 뜻]을 적어 보세요." oninput="S.mean[\''+w+'\']=this.value;save();hint3()">'+esc(S.mean[w]||"")+'</textarea></div>';
  });
  const n=S.sel.filter(w=>(S.mean[w]||"").trim()).length;
  return h+'<div id="bar3">'+bar(n===NEED?'모두 적었어요. [다음]을 눌러 사전의 뜻과 비교해 봅시다.':'낱말 '+NEED+'개의 뜻을 모두 적어 주세요. ('+n+'/'+NEED+')', n===NEED)+'</div>';
}
function hint3(){ const n=S.sel.filter(w=>(S.mean[w]||"").trim()).length; document.getElementById("bar3").innerHTML=bar(n===NEED?'모두 적었어요. [다음]을 눌러 사전의 뜻과 비교해 봅시다.':'낱말 '+NEED+'개의 뜻을 모두 적어 주세요. ('+n+'/'+NEED+')', n===NEED); }

function v4(){
  let h=head(4)+'<table class="tb"><tr><th>낱말</th><th>내가 정리한 뜻</th><th>사전의 뜻</th><th>종류</th></tr>';
  S.sel.forEach(w=>{ const f=info(w);
    h+='<tr><td><b>'+w+'</b><br><span class="small">'+f.b+'</span></td><td>'+esc(S.mean[w]||"")+'</td><td>'+f.d+'</td><td class="kind '+(f.k==="고"?"":"han")+'">'+KIND[f.k]+'</td></tr>';
  });
  h+='</table>';
  const g=favWords().length;
  h+='<div class="note '+(g?"":"p")+'">내가 고른 '+NEED+'개 가운데 고유어는 <b>'+g+'개</b>입니다. '+(g?'노란색으로 표시된 낱말은 한자를 바탕으로 만든 한자어(또는 한자와 고유어가 섞인 혼종어)예요.':'고유어가 하나도 없어요. 둘째 마당으로 돌아가 다시 골라 봅시다.')+'</div>';
  if(!g) h+='<p><button class="btn" onclick="go(2)">둘째 마당으로 돌아가기</button></p>';
  h+='<details><summary>노래 속 한자어·혼종어 모두 보기</summary><table class="tb" style="margin-top:8px">';
  Object.keys(D).forEach(w=>{ if(D[w].k!=="고") h+='<tr><td><b>'+w+'</b> ('+D[w].b+')</td><td>'+D[w].d+'</td><td class="kind han">'+KIND[D[w].k]+'</td></tr>'; });
  h+='</table></details>';
  return h+bar(g?'비교를 마쳤으면 [다음]을 눌러 마음에 드는 낱말을 골라 봅시다.':'고유어를 1개 이상 고른 뒤 넘어갈 수 있어요.', !!g);
}

function v5(){
  let h=head(5)+'<h2 class="q">내가 찾은 고유어 가운데 가장 마음에 드는 낱말 하나를 골라봅시다.</h2><div class="chips">';
  favWords().forEach(w=>{ h+='<div class="opt'+(S.fav===w?" sel":(S.fav?" dim":""))+'" onclick="S.fav=\''+w+'\';save();render()">'+w+'</div>'; });
  h+='</div>';
  if(S.fav){
    h+='<h2 class="q">내가 고른 낱말에서 떠오르는 장면이나 느낌을 정리해 봅시다.</h2><p class="small">고른 낱말: <b>'+S.fav+'</b> — '+info(S.fav).d+'</p>'+
    '<textarea placeholder="예) \'햇살\'이라는 낱말을 보면 창문으로 들어오는 따뜻한 빛이 떠올라요." oninput="S.scene=this.value;save();hint5()">'+esc(S.scene)+'</textarea>';
  }
  return h+'<div id="bar5">'+bar5()+'</div>';
}
function bar5(){ const ok=can(5); return bar(!S.fav?'마음에 드는 낱말을 하나 고르세요.':(ok?'잘했어요! [다음]을 눌러 고유어의 좋은 점을 생각해 봅시다.':'떠오르는 장면이나 느낌을 적어 주세요.'), ok); }
function hint5(){ document.getElementById("bar5").innerHTML=bar5(); }

function cmpHtml(col, han){
  let h='<div class="cmp'+(han?" han":"")+'"><h4>'+(han?"한자어로 바꾼 노랫말":"고유어로 쓴 노랫말")+'</h4>';
  CMP.forEach(p=>{ const line=p[col]; if(!line){ h+='<div style="height:10px"></div>'; return; }
    h+='<div>'+line.replace(/\{([^}]*)\}/g,'<span class="hi">$1</span>')+'</div>'; });
  return h+'</div>';
}
function v6(){
  let h=head(6)+'<h2 class="q">두 노랫말을 소리 내어 읽으며 비교해 봅시다.</h2><div class="grid2">'+cmpHtml(0,false)+cmpHtml(1,true)+'</div>'+
  '<h2 class="q">고유어를 사용하면 어떤 점이 좋을까요?</h2>'+
  '<textarea placeholder="두 노랫말을 읽었을 때의 느낌을 떠올리며 적어 보세요." oninput="S.good=this.value;save();hint6()">'+esc(S.good)+'</textarea>';
  return h+'<div id="bar6">'+bar6()+'</div>';
}
function bar6(){ const ok=can(6); return bar(ok?'[정리하기]를 눌러 활동을 마무리합시다.':'고유어의 좋은 점을 적어 주세요.', ok, "정리하기"); }
function hint6(){ document.getElementById("bar6").innerHTML=bar6(); }

function v7(){
  const b1 = S.b1 || S.fav;
  let h=head(7)+'<dl class="sum">'+
  '<dt>이름</dt><dd>'+esc(S.name)+'</dd>'+
  '<dt>내가 고른 낱말</dt><dd>'+S.sel.map(w=>w+' ('+KIND[info(w).k]+')').join(", ")+'</dd>'+
  '<dt>내가 정리한 뜻</dt><dd>'+S.sel.map(w=>'<b>'+w+'</b>: '+esc(S.mean[w]||"")).join("<br>")+'</dd>'+
  '<dt>가장 마음에 드는 낱말</dt><dd>'+esc(S.fav)+'</dd>'+
  '<dt>떠오르는 장면이나 느낌</dt><dd>'+esc(S.scene)+'</dd>'+
  '<dt>고유어를 사용하면 좋은 점</dt><dd>'+esc(S.good)+'</dd></dl>'+
  '<h2 class="q">다음 문장을 완성하여 짝에게 이야기해 봅시다.</h2><div class="sent">'+
  '노랫말의 ‘<input class="blank" id="b1" value="'+esc(b1)+'" oninput="S.b1=this.value;save();document.getElementById(\'eun\').textContent=eun(this.value)">’<span id="eun">'+eun(b1)+'</span> '+
  '<input class="blank" id="b2" placeholder="예) 따뜻한" value="'+esc(S.b2)+'" oninput="S.b2=this.value;save()">한 모습을 떠올리게 합니다.<br>'+
  '이처럼 고유어를 사용하면 <input class="blank" id="b3" placeholder="예) 느낌을 생생하게 표현" value="'+esc(S.b3)+'" oninput="S.b3=this.value;save()">할 수 있어서 좋습니다.</div>'+
  '<div id="sentOut"></div>'+
  '<p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">'+
  '<button class="btn g" onclick="showSent()">완성한 문장 보기</button>'+
  '<button class="btn y" onclick="saveJpg()">결과 화면 JPG로 저장</button>'+
  '<button class="btn" onclick="copyAll()">결과 복사</button>'+
  '<button class="btn sm" onclick="resetAll()">처음부터 다시</button></p>'+
  '<img id="jpgout" alt="결과 이미지"><p class="small" id="jpgmsg"></p>';
  return h+bar("활동을 모두 마쳤어요. 결과를 저장하고 짝과 이야기해 봅시다.", true);
}
function sentence(){ const b1=S.b1||S.fav; return "노랫말의 ‘"+b1+"’"+eun(b1)+" "+(S.b2||"____")+"한 모습을 떠올리게 합니다. 이처럼 고유어를 사용하면 "+(S.b3||"____")+"할 수 있어서 좋습니다."; }
function showSent(){ document.getElementById("sentOut").innerHTML='<div class="note">'+esc(sentence())+'</div>'; }
function resultText(){
  return ["[가을 아침, 고유어를 찾아서]","이름: "+S.name,"고른 낱말: "+S.sel.map(w=>w+"("+KIND[info(w).k]+")").join(", "),
  "내가 정리한 뜻: "+S.sel.map(w=>w+" - "+(S.mean[w]||"")).join(" / "),"마음에 드는 낱말: "+S.fav,"떠오르는 장면·느낌: "+S.scene,"고유어의 좋은 점: "+S.good,"완성한 문장: "+sentence()].join("\n");
}
function copyAll(){ const t=resultText(); if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>alert("결과가 복사되었습니다.")).catch(()=>prompt("아래 내용을 복사하세요.",t)); } else prompt("아래 내용을 복사하세요.",t); }
function resetAll(){ if(!confirm("모든 입력 내용을 지우고 처음부터 다시 할까요?")) return; S={name:"",step:0,q0:null,sel:[],mean:{},fav:"",scene:"",good:"",b1:"",b2:"",b3:""}; save(); render(); }

/* ---------- JPG 저장 ---------- */
function wrapText(ctx, text, maxW){
  const out=[]; String(text||"").split("\n").forEach(par=>{ let line=""; for(const ch of par){ const t=line+ch; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=ch; } else line=t; } out.push(line); });
  return out;
}
function saveJpg(){
  const W=1000, pad=48, inner=W-pad*2-40;
  const c=document.createElement("canvas"); const ctx=c.getContext("2d");
  const items=[["이름",S.name],["내가 고른 낱말",S.sel.map(w=>w+" ("+KIND[info(w).k]+")").join(", ")],
   ["내가 정리한 뜻",S.sel.map(w=>w+": "+(S.mean[w]||"")).join("\n")],["가장 마음에 드는 낱말",S.fav],["떠오르는 장면이나 느낌",S.scene],["고유어를 사용하면 좋은 점",S.good],["완성한 문장",sentence()]];
  ctx.font="22px Pretendard, 'Noto Sans KR', sans-serif";
  const blocks=items.map(it=>[it[0], wrapText(ctx,it[1],inner)]);
  const heroH = HERO_IMG ? 330 : 0;
  let H = heroH + 120;
  blocks.forEach(b=>{ H += 34 + b[1].length*32 + 18; });
  H += 60;
  c.width=W; c.height=H;
  let drawn=false;
  const draw=()=>{
    if(drawn) return; drawn=true;
    ctx.fillStyle="#FAF7EF"; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="#e9e3d3"; ctx.lineWidth=1; for(let x=0;x<W;x+=26){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();} for(let y=0;y<H;y+=26){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    let y=24;
    if(HERO_IMG && img.complete && img.naturalWidth){ const r=Math.max((W-48)/img.naturalWidth, (heroH-10)/img.naturalHeight); const dw=img.naturalWidth*r, dh=img.naturalHeight*r;
      ctx.save(); ctx.beginPath(); ctx.rect(24,y,W-48,heroH-10); ctx.clip(); ctx.drawImage(img,24+((W-48)-dw)/2,y+((heroH-10)-dh)/2,dw,dh); ctx.restore();
      ctx.strokeStyle="#1a1a1a"; ctx.lineWidth=4; ctx.strokeRect(24,y,W-48,heroH-10); y+=heroH; }
    // 카드
    ctx.fillStyle="#1a1a1a"; ctx.fillRect(24+6,y+6,W-48,H-y-30); ctx.fillStyle="#fff"; ctx.fillRect(24,y,W-48,H-y-30); ctx.strokeStyle="#1a1a1a"; ctx.lineWidth=4; ctx.strokeRect(24,y,W-48,H-y-30);
    y+=40; ctx.fillStyle="#FFD84D"; ctx.fillRect(pad,y-8,210,34); ctx.strokeRect(pad,y-8,210,34); ctx.fillStyle="#1a1a1a"; ctx.font="bold 18px Pretendard, 'Noto Sans KR', sans-serif"; ctx.fillText("국어 · 고유어 학습지", pad+14, y+16);
    ctx.font="bold 34px 'Black Han Sans', Pretendard, 'Noto Sans KR', sans-serif"; ctx.fillText("가을 아침, 고유어를 찾아서", pad, y+70);
    ctx.font="16px Pretendard, 'Noto Sans KR', sans-serif"; ctx.fillStyle="#666"; ctx.fillText(new Date().toLocaleDateString("ko-KR"), W-pad-110, y+70); y+=100;
    blocks.forEach(b=>{ ctx.fillStyle="#1a1a1a"; ctx.font="bold 20px Pretendard, 'Noto Sans KR', sans-serif"; ctx.fillText("■ "+b[0], pad, y); y+=34;
      ctx.font="22px Pretendard, 'Noto Sans KR', sans-serif"; b[1].forEach(l=>{ ctx.fillText(l, pad+20, y); y+=32; }); y+=18; });
    const name="고유어학습지_"+(S.name||"학생")+".jpg";
    const done=url=>{ const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      const o=document.getElementById("jpgout"); o.src=c.toDataURL("image/jpeg",0.92); o.style.display="block";
      document.getElementById("jpgmsg").textContent="'"+name+"' 파일이 다운로드되었습니다. 자동 저장이 안 되면 아래 이미지를 길게 눌러(또는 오른쪽 클릭) 저장하세요."; };
    if(c.toBlob) c.toBlob(b=>{ done(URL.createObjectURL(b)); },"image/jpeg",0.92); else done(c.toDataURL("image/jpeg",0.92));
  };
  const img=new Image();
  if(HERO_IMG){ img.onload=draw; img.onerror=draw; img.src=HERO_IMG; if(img.complete) draw(); } else draw();
}

/* ---------- 렌더 ---------- */
function render(){
  const app=document.getElementById("app");
  if(S.step===0){ app.innerHTML=vStart(); return; }
  const v=[null,v1,v2,v3,v4,v5,v6,v7][S.step];
  app.innerHTML=tabs()+'<div class="card">'+v()+'</div>';
}
load(); if(S.step>0 && !S.name) S.step=0; render();
</script>
